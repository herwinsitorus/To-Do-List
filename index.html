<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>To-Do List</title>
</head>

<body>
    <img src="asset/gambar-1.webp" alt="gambar-1" class="gambar-1">
    <h1>To-Do List</h1>
    <section class="card">
        <h2>Input Your Tasks</h2>
        <p class="description">Enter your tasks below:</p>
        <div class="input-container">
            <input type="text" id="input-task" placeholder="Enter your task here..." autocomplete="off">
            <button id="btn-add" class="btn btn-success"> Add Task</button>
        </div>
        <div class="list-container">
            <h3>Today's to-do list (<span id="amount-tasks">0</span>):</h3>
            <ul id="list-tasks" class="note-list"></ul>
            <p id="empty-massage" class="empty-state">No tasks yet. Please add a new task!</p>
        </div>
    </section>

    <script src="app.js"></script>
</body>

</html>
